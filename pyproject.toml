[project]
name = "rolefence-scan"
version = "0.1.0"
description = "Read-only exposure scanner for MCP servers in front of databases: reports what an AI model could reach that it should not."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "RoleFence" }]
keywords = ["mcp", "security", "scanner", "mongodb", "governance", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "pymongo>=4.8",
  "pyyaml>=6.0",
  "mcp>=1.2",
]

[project.scripts]
rolefence-scan = "rolefence_scan.cli:main"

[project.urls]
Homepage = "https://rolefence.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolefence_scan"]

[dependency-groups]
dev = ["pytest>=8"]
